[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "message-store-open-telemetry"
description = "OpenTelemetry tracing for the message-store package via store interception"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["nats", "jetstream", "opentelemetry", "tracing", "message-store"]
authors = [
  { name = "Rui Figueiredo", email = "rui@zencastr.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "opentelemetry-api",
  "message-store>=0.4.0",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/zencastr/message-store-open-telemetry"

[tool.hatch.version]
path = "message_store_open_telemetry/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["message_store_open_telemetry"]
